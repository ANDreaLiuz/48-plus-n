<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 670" role="img" aria-labelledby="t d">
<title id="t">48+N conceptual architecture and evidence boundaries</title><desc id="d">Human goal and observation feed Shadow research on low-level corrections, prediction, local response and operator feedback. Explicit human authority is needed before MechaLink coordinates a simulated executor. Dashed feedback is an intended integration relationship; complete physical-loop benefit is not established.</desc>
