<title id="title">Forecasting — two illustrative continuations</title><desc id="desc">Original conceptual illustration, not an experimental capture or actual motion data. A drawn past signal branches into equally weighted forecast and simple-baseline possibilities. There are no numeric axes, ticks, error bars, observed future outcomes or performance claims. Neither continuation is presented as the winner.</desc>
