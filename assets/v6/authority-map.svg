<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">48+N — human authority and the proposed research layers</title><desc id="desc">Original conceptual relationship map. The person supplies task goals and corrections and retains primary authority. The burnt-orange dashed route represents explicit human permission; it is distinct from prediction. MechaLink studies task goals, embodiment matching and coordination. Shadow studies a bidirectional low-level relationship among human corrections, prediction, robot-local response and return feedback. Solid inset labels name components exercised separately in sensing, recorded-motion/software checks and bounded simulation. Dashed connections are proposed integration relationships. No complete physical human-to-robot closed loop, unpublished protocol, or general method advantage is represented.</desc>
<defs>
 <pattern id="fine" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 12 0" stroke="#245d4a" stroke-opacity=".06" stroke-width="1"/></pattern>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf0e7"/><stop offset="1" stop-color="#c4d0c2"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce5da"/><stop offset=".48" stop-color="#a6bcb0"/><stop offset="1" stop-color="#658674"/></linearGradient>
 <radialGradient id="glass"><stop stop-color="#597d6b"/><stop offset=".5" stop-color="#142e29"/><stop offset=".8" stop-color="#315649"/><stop offset="1" stop-color="#10251f"/></radialGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#245d4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="authority" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#c26032" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
