<title id="title">Bounded manipulation — a conceptual simulation-domain plate</title><desc id="desc">Original conceptual illustration, not an experimental capture, CAD rendering or literal robot model. A stylized three-segment arm and gripper reach over a tabletop block. The SO-101 and MuJoCo labels identify the research domain only. A floating abstract re-observation window is a designed motif, not a rendered experiment. Simulation-domain evidence does not establish a complete physical loop.</desc>
